<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/nmts-inventory/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Manager</title>
    <script>
      // GitHub Pages serves index.html with a 10-minute cache. After a deploy,
      // a browser holding the old HTML asks for a build asset that the new
      // deploy deleted — it 404s and the page renders blank. Catch that and
      // reload once past the cache. The flag is cleared only when the app
      // actually mounts (see src/main.jsx), so a genuinely broken build
      // reloads at most once instead of looping.
      (function () {
        window.__NMTS_RELOAD_KEY = 'nmts_stale_asset_reload';
        window.addEventListener('error', function (event) {
          var el = event.target;
          if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK')) return;
          try {
            if (sessionStorage.getItem(window.__NMTS_RELOAD_KEY)) return;
            sessionStorage.setItem(window.__NMTS_RELOAD_KEY, '1');
          } catch (e) { return; }
          location.replace(location.pathname + '?rev=' + Date.now());
        }, true);
      })();
    </script>
    <script type="module" crossorigin src="/nmts-inventory/assets/index-DQWUvYtr.js"></script>
    <link rel="stylesheet" crossorigin href="/nmts-inventory/assets/index-DjUSjLpw.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
